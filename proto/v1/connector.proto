syntax = "proto3";

package v1.api;

import "google/protobuf/timestamp.proto";
import "v1/enums.proto";
import "v1/hardware.proto";

message EVSE {
  int32 Id = 1;
  EVCC EVCC = 2;
  PowerMeter PowerMeter = 3;
  ConnectorStatus Status = 4;
  optional Session Session = 5;
}

message Session {
  string transactionId = 1;
  string tagId = 2;
  google.protobuf.Timestamp started = 3;
  string Consumption = 4;
}

message Sample {
  Consumption Consumption = 1;
  string Measureand = 2;
  optional string Phase = 3;
  optional string Location = 4;
  optional string Context = 5;
  google.protobuf.Timestamp Timestamp = 6;
}

message Consumption {
  string Unit = 1;
  float Value = 2;
}
