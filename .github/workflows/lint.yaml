name: "Lint"

on:
  push:
    branches:
      - main
      - v2
    paths-ignore:
      - '.run/**'
      - 'docs/**'
      - 'deployments/**'
      - 'gen/**'
      - '*.md'

  pull_request:
    branches:
      - main
      - v2
    types: [ opened, synchronize ]
    paths-ignore:
      - '.run/**'
      - 'docs/**'
      - 'deployments/**'
      - 'gen/**'
      - '*.md'

jobs:
  lint:
    name: Lint Go code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.0

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
          args: --timeout=3m
