name: "Lint"

on:
  push:
    branches:
      - main
      - v2
    paths-ignore:
      - '.run/**'
      - 'docs/**'
      - 'deployments/**'
      - '*.md'

  pull_request:
    branches:
      - main
      - v2
    types: [ opened, synchronize ]
    paths-ignore:
      - '.run/**'
      - 'docs/**'
      - 'deployments/**'
      - '*.md'

jobs:
  lint:
    name: Lint Go code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.0

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.0
          args: --timeout=3m

  buf:
    name: Run buf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          github_token: ${{ github.token }}