name: "Buf"
on:
  pull_request:
    branches:
      - main
      - v2
    paths:
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'proto/**'
  push:
    branches:
      - main
      - v2
    paths:
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'buf/**'
      - 'proto/**'

jobs:
  buf:
    name: Run buf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: bufbuild/buf-action@v1
        with:
          github_token: ${{ github.token }}